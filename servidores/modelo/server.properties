# Configuração do servidor de testes.
#
# Só o que o bot precisa, com comentários de porque está assim.
# O Paper escreve aqui mais opções quando arranca; não as mexas à mão.

# --- Ligação ---
server-port=25565
server-ip=
motd=Servidor de testes do AFK Bot
# online-mode=false é o que permite ligar com "type": "offline", sem conta premium.
online-mode=false
enforce-secure-profile=false

# --- Jogadores ---
max-players=20
view-distance=6
simulation-distance=6
# O bot pode ser empurrado; sem protecção de spawn não fica preso à zona inicial.
spawn-protection=0
white-list=false
op-permission-level=4
difficulty=peaceful
gamemode=survival
force-gamemode=false
pvp=false

# --- Mundo ---
# Um mundo plano e vazio é o melhor sítio para ver o movimento anti-AFK: chão
# liso, sem obstáculos onde o bot fique preso num canto.
level-name=mundo-afk
level-type=minecraft\:flat
generator-settings={"layers":[{"block":"bedrock","height":1},{"block":"stone","height":2},{"block":"grass_block","height":1}],"biome":"plains"}
# Um mundo pequeno carrega depressa e é fácil de apagar.
max-world-size=1024
allow-nether=false
enable-command-block=false
spawn-monsters=false
spawn-animals=false
spawn-npcs=false

# --- ficheiros que o Paper cria e que não interessam ---
enable-status=true
sync-chunk-writes=false
enable-query=false
rate-limit=0
